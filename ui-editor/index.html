<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI Editor</title>
<style>
  * { box-sizing: border-box; }

  /* Theme = one accent color x dark/light mode, applied as CSS variables
     so 30 combinations stay maintainable instead of 30 hand-written
     stylesheets. Only --accent varies visually a lot between themes of
     the same mode; --bg/--panel/--text/--border/--dot stay put per mode
     so contrast is never at risk. Defaults below are overwritten by
     applyTheme() on load. */
  :root {
    --bg: #121212;
    --panel: #1c1d21;
    --text: #e6e6e6;
    --muted: #888;
    --border: #333;
    --dot: #232323;
    --accent: #5865F2;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    overflow: hidden; /* the canvas below handles its own scrolling */
  }

  .back-link {
    display: inline-block;
    color: var(--accent);
    text-decoration: none;
    font-size: 13px;
  }

  .back-link:hover { text-decoration: underline; }

  header {
    padding: 14px 20px 10px;
    border-bottom: 1px solid var(--border);
  }

  header h1 { margin: 6px 0 2px; font-size: 1.2rem; }
  header p.subtitle { margin: 0; font-size: 12.5px; color: var(--muted); }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    background-color: var(--panel);
    flex-wrap: wrap;
  }

  .toolbar button {
    background-color: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }

  .toolbar button:hover { border-color: var(--accent); }
  .toolbar button.active { border-color: var(--accent); outline: 1px solid var(--accent); }
  .toolbar .spacer { flex: 1; }
  .toolbar #clearBtn { background-color: #3a1c1c; border-color: #5c1c1c; color: #fff; }
  .toolbar #clearBtn:hover { border-color: #f87171; }
  .toolbar .hint { font-size: 11.5px; color: var(--muted); }

  /* ===================== THEME PICKER ===================== */
  .theme-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 20px;
    border-bottom: 1px solid var(--border);
    background-color: var(--panel);
    flex-wrap: wrap;
  }

  .theme-bar .theme-label { font-size: 11.5px; color: var(--muted); flex-shrink: 0; }
  .theme-bar .theme-name { font-size: 11.5px; color: var(--text); font-weight: 600; min-width: 110px; }

  .theme-row { display: flex; gap: 5px; flex-wrap: wrap; }

  .theme-swatch {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    padding: 0;
  }
  .theme-swatch.active { border-color: var(--text); box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px var(--text); }

  .canvas-wrapper {
    position: relative;
    width: 100%;
    height: calc(100vh - 148px);
    overflow: auto;
    background-color: var(--bg);
  }

  .canvas {
    position: relative;
    width: 2600px;
    height: 1600px;
    background-image: radial-gradient(var(--dot) 1px, transparent 1px);
    background-size: 22px 22px;
  }

  /* ===================== ELEMENTS ===================== */
  .el {
    position: absolute;
    cursor: move;
    user-select: none;
  }

  .el.selected { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Every inner content type fills its wrapper's exact geometry - stated
     explicitly rather than relied on implicitly, since a plain block
     child does not auto-fill an absolutely positioned parent's height. */
  .el-box, .el-text, .el-image, .el-table, .el-circle, .el-line, .el-input, .el-checkbox, .el-icon {
    width: 100%;
    height: 100%;
  }

  .el-box {
    background-color: #2b2d31;
    border: 2px solid #3f4147;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px;
    text-align: center;
    font-size: 13px;
    color: #e6e6e6;
    overflow: hidden;
  }

  .el-box[contenteditable="true"], .el-text[contenteditable="true"], .el-input[contenteditable="true"] { cursor: text; outline: none; }

  .el-button { font-weight: 700; cursor: pointer; }
  .el-badge { font-weight: 600; font-size: 12px; }

  .el-text {
    font-size: 16px;
    color: #e6e6e6;
    padding: 4px;
    white-space: pre-wrap;
    overflow: hidden;
  }

  .el-image {
    background-color: #1a1a1a;
    border: 2px dashed #3f4147;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #666;
    overflow: hidden;
  }

  .el-image img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .el-table table { border-collapse: collapse; width: 100%; height: 100%; table-layout: fixed; }
  .el-table td {
    border: 1px solid #3f4147;
    padding: 4px 6px;
    font-size: 12px;
    color: #e6e6e6;
    overflow: hidden;
    outline: none;
  }
  .el-table td:first-child { background-color: #1e1f22; font-weight: 600; }

  .el-circle { border-radius: 50%; border: 2px solid; }

  .el-line { border-radius: 3px; }

  .el-input {
    display: flex;
    align-items: center;
    padding: 0 12px;
    border: 1px solid;
    border-radius: 6px;
    font-size: 13px;
    text-align: left;
    justify-content: flex-start;
    overflow: hidden;
    white-space: nowrap;
  }

  .el-checkbox {
    border: 2px solid;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 900;
    cursor: pointer;
    font-size: 16px;
  }

  .el-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  /* Resize handles - 4 corners (both axes) + 4 edges (single axis), so a
     box can be stretched wider without also getting taller, or vice
     versa, not just resized diagonally from a corner. */
  .resize-handle {
    position: absolute;
    background-color: var(--accent);
    border: 1px solid #fff;
    border-radius: 2px;
    z-index: 10;
  }
  .resize-handle.tl, .resize-handle.tr, .resize-handle.bl, .resize-handle.br { width: 10px; height: 10px; }
  .resize-handle.tl { top: -5px; left: -5px; cursor: nwse-resize; }
  .resize-handle.tr { top: -5px; right: -5px; cursor: nesw-resize; }
  .resize-handle.bl { bottom: -5px; left: -5px; cursor: nesw-resize; }
  .resize-handle.br { bottom: -5px; right: -5px; cursor: nwse-resize; }

  .resize-handle.t, .resize-handle.b { width: 16px; height: 8px; left: 50%; transform: translateX(-50%); cursor: ns-resize; }
  .resize-handle.t { top: -4px; }
  .resize-handle.b { bottom: -4px; }
  .resize-handle.l, .resize-handle.r { width: 8px; height: 16px; top: 50%; transform: translateY(-50%); cursor: ew-resize; }
  .resize-handle.l { left: -4px; }
  .resize-handle.r { right: -4px; }

  /* Floating per-element property bar, shown above the selected element */
  .prop-bar {
    position: absolute;
    display: flex;
    align-items: center;
    gap: 6px;
    background-color: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 7px;
    z-index: 20;
    font-size: 11.5px;
    white-space: nowrap;
    max-width: 420px;
    flex-wrap: wrap;
  }

  .prop-bar label { display: flex; align-items: center; gap: 4px; color: #aaa; }
  .prop-bar input[type="color"] { width: 22px; height: 22px; border: none; padding: 0; background: none; cursor: pointer; }
  .prop-bar input[type="range"] { width: 60px; }
  .prop-bar input[type="number"] { width: 42px; background: #2b2d31; border: 1px solid #3f4147; color: #fff; border-radius: 4px; padding: 2px 4px; }
  .prop-bar button {
    background-color: #2b2d31; color: #fff; border: 1px solid #3f4147; border-radius: 4px;
    padding: 3px 7px; cursor: pointer; font-size: 11.5px;
  }
  .prop-bar button:hover { border-color: var(--accent); }
  .prop-bar button.glyph-btn { font-size: 14px; padding: 3px 6px; }
  .prop-bar .del-btn { background-color: #3a1c1c; border-color: #5c1c1c; color: #f87171; font-weight: 700; }
  .prop-bar .del-btn:hover { border-color: #f87171; }
</style>
</head>
<body>

<header>
  <a class="back-link" href="../">&larr; Back to Hub</a>
  <h1>UI Editor</h1>
  <p class="subtitle">Freeform mockup canvas - drag, resize, and delete boxes, text, images, and tables. Autosaves in this browser.</p>
</header>

<div class="toolbar">
  <button data-add="box">+ Box</button>
  <button data-add="text">+ Text</button>
  <button data-add="image">+ Image</button>
  <button data-add="table">+ Table</button>
  <button data-add="button">+ Button</button>
  <button data-add="badge">+ Badge</button>
  <button data-add="input">+ Input</button>
  <button data-add="checkbox">+ Checkbox</button>
  <button data-add="circle">+ Circle</button>
  <button data-add="line">+ Line</button>
  <button data-add="icon">+ Icon</button>
  <div class="spacer"></div>
  <span class="hint">Click to select &middot; drag edges/corners to resize &middot; double-click to edit text &middot; Delete key or the &times; button to remove</span>
  <button id="clearBtn">Clear Canvas</button>
</div>

<div class="theme-bar" id="themeBar">
  <span class="theme-label">Theme:</span>
  <span class="theme-name" id="themeName"></span>
  <span class="theme-label">Dark</span>
  <div class="theme-row" id="themeRowDark"></div>
  <span class="theme-label">Light</span>
  <div class="theme-row" id="themeRowLight"></div>
</div>

<div class="canvas-wrapper">
  <div class="canvas" id="canvas"></div>
</div>

<script>
  const STORAGE_KEY = 'ui-editor-canvas-v1';
  const canvas = document.getElementById('canvas');

  let elements = [];   // {id, type, x, y, w, h, z, ...type-specific fields}
  let nextId = 1;
  let nextZ = 1;
  let selectedId = null;
  const domById = new Map(); // id -> that element's wrapper .el node, rebuilt on every full render()

  // ===================== THEMES =====================
  // 15 accent hues x 2 modes = 30 combinations, generated instead of
  // hand-written - only --accent changes visually between themes of the
  // same mode, so contrast never depends on getting 30 palettes right
  // individually, just one per mode.
  const ACCENTS = [
    ['Blue', '#3b82f6'], ['Indigo', '#6366f1'], ['Violet', '#8b5cf6'], ['Purple', '#a855f7'], ['Fuchsia', '#d946ef'],
    ['Pink', '#ec4899'], ['Rose', '#f43f5e'], ['Red', '#ef4444'], ['Orange', '#f97316'], ['Amber', '#f59e0b'],
    ['Gold', '#eab308'], ['Lime', '#84cc16'], ['Green', '#22c55e'], ['Teal', '#14b8a6'], ['Cyan', '#06b6d4'],
  ];
  const MODES = {
    dark: { label: 'Dark', bg: '#121212', panel: '#1c1d21', text: '#e6e6e6', muted: '#888', border: '#333', dot: '#232323' },
    light: { label: 'Light', bg: '#f7f7f9', panel: '#ffffff', text: '#1a1a1e', muted: '#666', border: '#e2e2e8', dot: '#dcdce2' },
  };
  const THEMES = [];
  Object.keys(MODES).forEach(modeId => {
    ACCENTS.forEach(([name, hex]) => {
      THEMES.push({ id: modeId + '-' + name.toLowerCase(), name: name + ' ' + MODES[modeId].label, mode: modeId, accent: hex, ...MODES[modeId] });
    });
  });

  let currentTheme = THEMES[0];

  function applyTheme(theme) {
    currentTheme = theme;
    const root = document.documentElement.style;
    root.setProperty('--bg', theme.bg);
    root.setProperty('--panel', theme.panel);
    root.setProperty('--text', theme.text);
    root.setProperty('--muted', theme.muted);
    root.setProperty('--border', theme.border);
    root.setProperty('--dot', theme.dot);
    root.setProperty('--accent', theme.accent);
    document.getElementById('themeName').textContent = theme.name;
    document.querySelectorAll('.theme-swatch').forEach(s => s.classList.toggle('active', s.dataset.id === theme.id));
    saveTheme();
  }

  function buildThemePicker() {
    const dark = document.getElementById('themeRowDark');
    const light = document.getElementById('themeRowLight');
    THEMES.forEach(t => {
      const btn = document.createElement('button');
      btn.className = 'theme-swatch';
      btn.style.backgroundColor = t.accent;
      btn.dataset.id = t.id;
      btn.title = t.name;
      btn.addEventListener('click', () => applyTheme(t));
      (t.mode === 'dark' ? dark : light).appendChild(btn);
    });
  }

  function saveTheme() {
    localStorage.setItem(STORAGE_KEY + '-theme', currentTheme.id);
  }

  function loadTheme() {
    const savedId = localStorage.getItem(STORAGE_KEY + '-theme');
    applyTheme(THEMES.find(t => t.id === savedId) || THEMES[0]);
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        elements = data.elements || [];
        nextId = data.nextId || (elements.length + 1);
        nextZ = data.nextZ || (elements.length + 1);
      }
    } catch (e) { /* corrupt/old data - start fresh */ }
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ elements, nextId, nextZ }));
  }

  // Selection only toggles classes/handles/the prop-bar for the two
  // elements involved - it deliberately never does a full render(). A
  // full canvas rebuild happening inside a pointerdown handler would
  // destroy the very DOM node the browser is about to focus for text
  // editing (and would detach the node an in-progress drag is moving).
  function selectElement(id) {
    const prevId = selectedId;
    selectedId = id;
    const el = elements.find(e => e.id === id);
    if (el) el.z = nextZ++;
    updateSelectionVisuals(prevId, id);
  }

  function deselect() {
    const prevId = selectedId;
    selectedId = null;
    updateSelectionVisuals(prevId, null);
  }

  function updateSelectionVisuals(prevId, newId) {
    if (prevId != null && prevId !== newId) {
      const prevDom = domById.get(prevId);
      if (prevDom) {
        prevDom.classList.remove('selected');
        prevDom.querySelectorAll('.resize-handle').forEach(h => h.remove());
      }
      const prevBar = document.getElementById('propbar-' + prevId);
      if (prevBar) prevBar.remove();
    }
    if (newId != null) {
      const data = elements.find(e => e.id === newId);
      const domEl = domById.get(newId);
      if (domEl && data) {
        domEl.classList.add('selected');
        domEl.style.zIndex = data.z;
        if (!domEl.querySelector('.resize-handle')) {
          ['tl', 'tr', 'bl', 'br', 't', 'r', 'b', 'l'].forEach(corner => {
            const h = document.createElement('div');
            h.className = 'resize-handle ' + corner;
            domEl.appendChild(h);
            makeResizable(domEl, data, h, corner);
          });
        }
        if (!document.getElementById('propbar-' + newId)) {
          const bar = buildPropBar(data);
          canvas.appendChild(bar);
          positionPropBar(data);
        }
      }
    }
  }

  function deleteElement(id) {
    elements = elements.filter(e => e.id !== id);
    if (selectedId === id) selectedId = null;
    save();
    render();
  }

  let spawnStep = 0;

  function addElement(type) {
    // Stagger each new element diagonally so freshly-added ones don't spawn
    // stacked exactly on top of the last one - the first spot would
    // otherwise be unreachable once several elements pile up on it.
    const spawnX = 80 + (spawnStep % 8) * 34;
    const spawnY = 80 + (spawnStep % 8) * 34;
    spawnStep++;
    const base = { id: nextId++, type, x: spawnX, y: spawnY, w: 200, h: 120, z: nextZ++ };
    if (type === 'box') Object.assign(base, { w: 200, h: 100, bg: '#2b2d31', border: '#3f4147', radius: 8, text: 'Box' });
    if (type === 'text') Object.assign(base, { w: 160, h: 40, text: 'Text', fontSize: 16, color: '#e6e6e6' });
    if (type === 'image') Object.assign(base, { w: 220, h: 150, src: '' });
    if (type === 'table') Object.assign(base, { w: 320, h: 140, rows: 3, cols: 3, cells: makeGrid(3, 3) });
    if (type === 'button') Object.assign(base, { w: 140, h: 44, bg: currentTheme.accent, textColor: '#ffffff', radius: 8, text: 'Button' });
    if (type === 'badge') Object.assign(base, { w: 110, h: 32, bg: '#15803d', textColor: '#ffffff', radius: 16, text: 'Badge' });
    if (type === 'input') Object.assign(base, { w: 220, h: 40, bg: currentTheme.panel, border: currentTheme.border, textColor: currentTheme.muted, text: 'Input placeholder' });
    if (type === 'checkbox') Object.assign(base, { w: 26, h: 26, checked: false, accentColor: currentTheme.accent });
    if (type === 'circle') Object.assign(base, { w: 80, h: 80, bg: '#2b2d31', border: '#3f4147' });
    if (type === 'line') Object.assign(base, { w: 200, h: 4, bg: currentTheme.border });
    if (type === 'icon') Object.assign(base, { w: 48, h: 48, glyph: '★', color: currentTheme.accent });
    elements.push(base);
    // A brand-new element has no DOM node yet, so this needs the full
    // render() (unlike selecting an EXISTING element, which never
    // rebuilds the DOM - see selectElement above).
    selectedId = base.id;
    save();
    render();
  }

  function makeGrid(rows, cols) {
    const g = [];
    for (let r = 0; r < rows; r++) {
      const row = [];
      for (let c = 0; c < cols; c++) row.push(r === 0 ? `Col ${c + 1}` : '');
      g.push(row);
    }
    return g;
  }

  document.querySelectorAll('.toolbar [data-add]').forEach(btn => {
    btn.addEventListener('click', () => addElement(btn.dataset.add));
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    if (elements.length && !confirm('Clear the whole canvas? This cannot be undone.')) return;
    elements = [];
    selectedId = null;
    save();
    render();
  });

  canvas.addEventListener('pointerdown', (e) => {
    if (e.target === canvas) deselect();
  });

  document.addEventListener('keydown', (e) => {
    if (!selectedId) return;
    const active = document.activeElement;
    if (active && active.isContentEditable) return; // don't delete while typing
    if (e.key === 'Delete' || e.key === 'Backspace') {
      e.preventDefault();
      deleteElement(selectedId);
    }
  });

  // Click-vs-drag is decided by movement distance, not by which inner
  // element was clicked - this lets a plain click on a box/text/table
  // cell still focus it for editing (contenteditable's own default
  // behavior), while a click-and-move on that same spot drags the
  // element instead, without the two fighting each other.
  const DRAG_THRESHOLD = 4;

  // Both drag and resize listen on `document` for move/up rather than on
  // the dragged element or the tiny resize handle - relying on the small
  // handle (10x10px) to keep receiving pointermove once the cursor moves
  // past its own bounds isn't reliable, pointer capture or not.
  function makeDraggable(domEl, data) {
    domEl.addEventListener('pointerdown', (e) => {
      if (e.target.classList.contains('resize-handle')) return;
      if (e.target.closest('.prop-bar')) return;
      selectElement(data.id);
      const startX = e.clientX, startY = e.clientY;
      const origX = data.x, origY = data.y;
      let moved = false;
      function onMove(ev) {
        const dx = ev.clientX - startX, dy = ev.clientY - startY;
        if (!moved) {
          if (Math.hypot(dx, dy) < DRAG_THRESHOLD) return;
          moved = true;
          // A real drag started - drop any active text-edit focus so
          // typing doesn't fight with the element moving underneath it.
          if (document.activeElement && document.activeElement.isContentEditable) document.activeElement.blur();
        }
        data.x = Math.max(0, origX + dx);
        data.y = Math.max(0, origY + dy);
        domEl.style.left = data.x + 'px';
        domEl.style.top = data.y + 'px';
        positionPropBar(data);
      }
      function onUp() {
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        if (moved) {
          save();
        } else if (data.type === 'checkbox') {
          // A genuine click (no drag) on a checkbox toggles it - reusing
          // the `moved` flag this function already tracks, rather than a
          // separate click listener that would need its own way to tell
          // "was this a click or the end of a drag."
          data.checked = !data.checked;
          save();
          refreshElementVisual(data);
        }
      }
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });
  }

  function makeResizable(domEl, data, handle, corner) {
    handle.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      const startX = e.clientX, startY = e.clientY;
      const orig = { x: data.x, y: data.y, w: data.w, h: data.h };
      function onMove(ev) {
        const dx = ev.clientX - startX, dy = ev.clientY - startY;
        if (corner.includes('r')) data.w = Math.max(60, orig.w + dx);
        if (corner.includes('l')) { data.w = Math.max(60, orig.w - dx); data.x = orig.x + (orig.w - data.w); }
        if (corner.includes('b')) data.h = Math.max(30, orig.h + dy);
        if (corner.includes('t')) { data.h = Math.max(30, orig.h - dy); data.y = orig.y + (orig.h - data.h); }
        applyGeometry(domEl, data);
        positionPropBar(data);
        if (data.type === 'icon') {
          const iconInner = domEl.querySelector('.el-icon');
          if (iconInner) iconInner.style.fontSize = Math.min(data.w, data.h) * 0.65 + 'px';
        }
      }
      function onUp() {
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        save();
      }
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });
  }

  function applyGeometry(domEl, data) {
    domEl.style.left = data.x + 'px';
    domEl.style.top = data.y + 'px';
    domEl.style.width = data.w + 'px';
    domEl.style.height = data.h + 'px';
  }

  function positionPropBar(data) {
    const bar = document.getElementById('propbar-' + data.id);
    if (!bar) return;
    bar.style.left = data.x + 'px';
    bar.style.top = Math.max(0, data.y - 40) + 'px';
  }

  function buildPropBar(data) {
    const bar = document.createElement('div');
    bar.className = 'prop-bar';
    bar.id = 'propbar-' + data.id;

    if (data.type === 'box') {
      bar.innerHTML = `
        <label>Fill <input type="color" data-k="bg" value="${data.bg}"></label>
        <label>Border <input type="color" data-k="border" value="${data.border}"></label>
        <label>Radius <input type="range" min="0" max="40" data-k="radius" value="${data.radius}"></label>
      `;
    } else if (data.type === 'text') {
      bar.innerHTML = `
        <label>Color <input type="color" data-k="color" value="${data.color}"></label>
        <label>Size <input type="number" min="8" max="72" data-k="fontSize" value="${data.fontSize}"></label>
      `;
    } else if (data.type === 'image') {
      bar.innerHTML = `<button data-action="upload">Choose Image&hellip;</button>`;
    } else if (data.type === 'table') {
      bar.innerHTML = `
        <button data-action="rowplus">+Row</button>
        <button data-action="rowminus">-Row</button>
        <button data-action="colplus">+Col</button>
        <button data-action="colminus">-Col</button>
      `;
    } else if (data.type === 'button' || data.type === 'badge') {
      bar.innerHTML = `
        <label>Fill <input type="color" data-k="bg" value="${data.bg}"></label>
        <label>Text <input type="color" data-k="textColor" value="${data.textColor}"></label>
        <label>Radius <input type="range" min="0" max="30" data-k="radius" value="${data.radius}"></label>
      `;
    } else if (data.type === 'input') {
      bar.innerHTML = `
        <label>Fill <input type="color" data-k="bg" value="${data.bg}"></label>
        <label>Border <input type="color" data-k="border" value="${data.border}"></label>
        <label>Text <input type="color" data-k="textColor" value="${data.textColor}"></label>
      `;
    } else if (data.type === 'circle') {
      bar.innerHTML = `
        <label>Fill <input type="color" data-k="bg" value="${data.bg}"></label>
        <label>Border <input type="color" data-k="border" value="${data.border}"></label>
      `;
    } else if (data.type === 'line') {
      bar.innerHTML = `<label>Color <input type="color" data-k="bg" value="${data.bg}"></label>`;
    } else if (data.type === 'checkbox') {
      bar.innerHTML = `
        <label>Color <input type="color" data-k="accentColor" value="${data.accentColor}"></label>
        <button data-action="toggle">${data.checked ? 'Uncheck' : 'Check'}</button>
      `;
    } else if (data.type === 'icon') {
      const glyphs = ['★', '♥', '✓', '✗', '⚙', '🔍', '📁', '🔔', '👤', '⬆', '⬇', '⬅', '➡', '▶', '🗑', '✏', '⚠', 'ℹ', '🔒', '📷'];
      bar.innerHTML = `
        <label>Color <input type="color" data-k="color" value="${data.color}"></label>
        ${glyphs.map(g => `<button class="glyph-btn" data-glyph="${g}">${g}</button>`).join('')}
      `;
    }

    const delBtn = document.createElement('button');
    delBtn.className = 'del-btn';
    delBtn.textContent = '×';
    delBtn.title = 'Delete';
    delBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
    delBtn.addEventListener('click', () => deleteElement(data.id));
    bar.appendChild(delBtn);

    bar.addEventListener('pointerdown', (e) => e.stopPropagation());

    bar.querySelectorAll('input[data-k]').forEach(input => {
      input.addEventListener('input', () => {
        data[input.dataset.k] = (input.type === 'range' || input.type === 'number') ? Number(input.value) : input.value;
        save();
        refreshElementVisual(data);
      });
    });

    const uploadBtn = bar.querySelector('[data-action="upload"]');
    if (uploadBtn) {
      uploadBtn.addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.addEventListener('change', () => {
          const file = input.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => { data.src = reader.result; save(); refreshElementVisual(data); };
          reader.readAsDataURL(file);
        });
        input.click();
      });
    }

    const rowPlus = bar.querySelector('[data-action="rowplus"]');
    const rowMinus = bar.querySelector('[data-action="rowminus"]');
    const colPlus = bar.querySelector('[data-action="colplus"]');
    const colMinus = bar.querySelector('[data-action="colminus"]');
    if (rowPlus) rowPlus.addEventListener('click', () => { data.rows++; data.cells.push(new Array(data.cols).fill('')); save(); refreshElementVisual(data); });
    if (rowMinus) rowMinus.addEventListener('click', () => { if (data.rows > 1) { data.rows--; data.cells.pop(); save(); refreshElementVisual(data); } });
    if (colPlus) colPlus.addEventListener('click', () => { data.cols++; data.cells.forEach(r => r.push('')); save(); refreshElementVisual(data); });
    if (colMinus) colMinus.addEventListener('click', () => { if (data.cols > 1) { data.cols--; data.cells.forEach(r => r.pop()); save(); refreshElementVisual(data); } });

    const toggleBtn = bar.querySelector('[data-action="toggle"]');
    if (toggleBtn) {
      toggleBtn.addEventListener('click', () => {
        data.checked = !data.checked;
        toggleBtn.textContent = data.checked ? 'Uncheck' : 'Check';
        save();
        refreshElementVisual(data);
      });
    }

    bar.querySelectorAll('[data-glyph]').forEach(btn => {
      btn.addEventListener('click', () => {
        data.glyph = btn.dataset.glyph;
        save();
        refreshElementVisual(data);
      });
    });

    return bar;
  }

  // Single click selects/moves an element; double-click is what actually
  // enters text editing (contentEditable is off until then). Keeping
  // those separate - rather than the text area being permanently
  // contentEditable - means a plain click-select doesn't also silently
  // focus it for typing, which would otherwise make the Delete key
  // never work right after selecting something (it deliberately backs
  // off while real text-editing is in progress).
  function makeDblClickEditable(el, onCommit) {
    el.addEventListener('dblclick', (e) => {
      el.contentEditable = 'true';
      el.focus();
      window.getSelection().selectAllChildren(el);
      e.stopPropagation();
    });
    el.addEventListener('blur', () => {
      onCommit(el.textContent);
      el.contentEditable = 'false';
    });
  }

  // Builds just the TYPE-SPECIFIC inner content of an element (the part
  // that changes when a property-bar control edits it) - shared by the
  // initial build and by refreshElementVisual() below, so the two never
  // drift out of sync with each other.
  function buildInner(data) {
    let inner;

    if (data.type === 'box') {
      inner = document.createElement('div');
      inner.className = 'el-box';
      inner.textContent = data.text;
      inner.style.backgroundColor = data.bg;
      inner.style.borderColor = data.border;
      inner.style.borderRadius = data.radius + 'px';
      makeDblClickEditable(inner, (text) => { data.text = text; save(); });
    } else if (data.type === 'text') {
      inner = document.createElement('div');
      inner.className = 'el-text';
      inner.textContent = data.text;
      inner.style.color = data.color;
      inner.style.fontSize = data.fontSize + 'px';
      makeDblClickEditable(inner, (text) => { data.text = text; save(); });
    } else if (data.type === 'image') {
      inner = document.createElement('div');
      inner.className = 'el-image';
      inner.textContent = data.src ? '' : 'No image - select it and click "Choose Image"';
      if (data.src) {
        const img = document.createElement('img');
        img.src = data.src;
        inner.appendChild(img);
      }
    } else if (data.type === 'table') {
      inner = document.createElement('div');
      inner.className = 'el-table';
      const table = document.createElement('table');
      data.cells.forEach((row, ri) => {
        const tr = document.createElement('tr');
        row.forEach((cellText, ci) => {
          const td = document.createElement('td');
          td.textContent = cellText;
          makeDblClickEditable(td, (text) => { data.cells[ri][ci] = text; save(); });
          tr.appendChild(td);
        });
        table.appendChild(tr);
      });
      inner.appendChild(table);
    } else if (data.type === 'button' || data.type === 'badge') {
      // Both reuse the box's flex-centered-text look, just with different
      // default sizing/font weight (el-button/el-badge add-on classes).
      inner = document.createElement('div');
      inner.className = 'el-box el-' + data.type;
      inner.textContent = data.text;
      inner.style.backgroundColor = data.bg;
      inner.style.color = data.textColor;
      inner.style.borderRadius = data.radius + 'px';
      inner.style.border = 'none';
      makeDblClickEditable(inner, (text) => { data.text = text; save(); });
    } else if (data.type === 'input') {
      inner = document.createElement('div');
      inner.className = 'el-input';
      inner.textContent = data.text;
      inner.style.backgroundColor = data.bg;
      inner.style.borderColor = data.border;
      inner.style.color = data.textColor;
      makeDblClickEditable(inner, (text) => { data.text = text; save(); });
    } else if (data.type === 'circle') {
      inner = document.createElement('div');
      inner.className = 'el-circle';
      inner.style.backgroundColor = data.bg;
      inner.style.borderColor = data.border;
    } else if (data.type === 'line') {
      inner = document.createElement('div');
      inner.className = 'el-line';
      inner.style.backgroundColor = data.bg;
    } else if (data.type === 'checkbox') {
      inner = document.createElement('div');
      inner.className = 'el-checkbox';
      updateCheckboxVisual(inner, data);
    } else if (data.type === 'icon') {
      inner = document.createElement('div');
      inner.className = 'el-icon';
      inner.textContent = data.glyph;
      inner.style.color = data.color;
      inner.style.fontSize = Math.min(data.w, data.h) * 0.65 + 'px';
    }

    return inner;
  }

  function updateCheckboxVisual(inner, data) {
    inner.style.borderColor = data.accentColor;
    inner.style.backgroundColor = data.checked ? data.accentColor : 'transparent';
    inner.textContent = data.checked ? '✓' : '';
  }

  // Swaps in freshly-built inner content for ONE element without
  // touching its wrapper, resize handles, the prop-bar, or any other
  // element - used when a property-bar control (color, radius, font
  // size, image upload, table row/col count) edits an already-selected
  // element, so a slider drag or a click elsewhere isn't disrupted.
  function refreshElementVisual(data) {
    const domEl = domById.get(data.id);
    if (!domEl) return;
    const oldInner = domEl.querySelector(':scope > .el-' + data.type);
    domEl.replaceChild(buildInner(data), oldInner);
  }

  function buildElementDom(data) {
    const inner = buildInner(data);

    const domEl = document.createElement('div');
    // Deliberately no "el-{type}" class here - that class belongs to the
    // inner content div only (buildInner above). Giving the wrapper the
    // same class made ".el-image" etc. match two elements per item.
    domEl.className = 'el' + (data.id === selectedId ? ' selected' : '');
    domEl.style.zIndex = data.z;
    domEl.appendChild(inner);
    applyGeometry(domEl, data);
    domById.set(data.id, domEl);

    if (data.id === selectedId) {
      ['tl', 'tr', 'bl', 'br', 't', 'r', 'b', 'l'].forEach(corner => {
        const h = document.createElement('div');
        h.className = 'resize-handle ' + corner;
        domEl.appendChild(h);
        makeResizable(domEl, data, h, corner);
      });
    }

    makeDraggable(domEl, data);
    return domEl;
  }

  // Full rebuild - only used where the DOM genuinely needs to be torn
  // down (initial load, add, delete, clear), never from a selection or
  // property-bar interaction.
  function render() {
    canvas.innerHTML = '';
    domById.clear();
    elements.slice().sort((a, b) => a.z - b.z).forEach(data => {
      canvas.appendChild(buildElementDom(data));
    });
    if (selectedId != null) {
      const data = elements.find(e => e.id === selectedId);
      if (data) {
        const bar = buildPropBar(data);
        canvas.appendChild(bar);
        positionPropBar(data);
      }
    }
  }

  buildThemePicker();
  loadTheme();
  load();
  render();
</script>

</body>
</html>

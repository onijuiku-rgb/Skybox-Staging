<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firebase Test - CapKingdom Prototype</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background-color: #121212;
    color: #e6e6e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }

  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  p.subtitle { color: #999; margin: 0 0 20px; font-size: 13px; }

  #statusLine {
    font-size: 12px;
    color: #888;
    margin-bottom: 16px;
    min-height: 16px;
  }

  #statusLine.connected { color: #17c964; }
  #statusLine.error { color: #f87171; }

  button {
    background-color: #2b2d31;
    color: #fff;
    border: 1px solid #3f4147;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 20px;
  }

  button:hover { border-color: #5865F2; }

  table {
    border-collapse: collapse;
    width: 100%;
  }

  th, td {
    padding: 8px 10px;
    text-align: left;
    border-bottom: 1px solid #2a2a2a;
    font-size: 13px;
  }

  th {
    color: #a3e6be;
    border-bottom: 2px solid #17382d;
  }

  select {
    background-color: #2b2d31;
    color: #fff;
    border: 1px solid #3f4147;
    border-radius: 12px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  /* Status colors - same meanings as the Apps Script version's dropdown pills */
  select.status-good { background-color: #1c5c34; border-color: #1c5c34; }
  select.status-bad { background-color: #5c1c1c; border-color: #5c1c1c; }
  select.status-warn { background-color: #5c4a1c; border-color: #5c4a1c; }
  select.status-neutral { background-color: #2b2d31; }
</style>
</head>
<body>

<h1>Firebase Test - CapKingdom Prototype</h1>
<p class="subtitle">Small-scale proof of concept: a few subareas × a few skyboxes, reading and writing live from Firestore.</p>

<div id="statusLine">Connecting to Firestore...</div>

<button id="seedBtn">Seed Sample Data (only needed once)</button>

<table id="capTable">
  <thead id="capTableHead"></thead>
  <tbody id="capTableBody"></tbody>
</table>

<script type="module">
  // ===================== FIREBASE SETUP =====================
  // Modular SDK, loaded straight from Google's CDN as ES module imports -
  // no npm/build step needed, works the same as any other <script> tag.
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore,
    collection,
    doc,
    getDoc,
    setDoc,
    onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // This apiKey is safe to have in plain view in client-side code - it's
  // not a secret. Real access control comes from Firestore Security Rules
  // (set in the Firebase console), not from hiding this object.
  const firebaseConfig = {
    apiKey: "AIzaSyAzJhU7wI1iFPEExIgCD-DpZ8sKljtH7Yk",
    authDomain: "smo-skybox-testing.firebaseapp.com",
    projectId: "smo-skybox-testing",
    storageBucket: "smo-skybox-testing.firebasestorage.app",
    messagingSenderId: "604114241784",
    appId: "1:604114241784:web:591528df76f683a843530d"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ===================== DATA SHAPE =====================
  // One Firestore COLLECTION per Kingdom (here: "capKingdom_test" - kept
  // separate from any future real "capKingdom" collection so this test
  // data never mixes with the real thing).
  //
  // Inside that collection, one DOCUMENT per subarea. Each document has a
  // single field called "statuses", which is a map (Firestore's version
  // of a JS object) of { skyboxName: statusValue }.
  const COLLECTION_NAME = "capKingdom_test";

  // Small subset for this prototype - just enough to prove it works.
  // Scaling to all 136 skyboxes later is the same pattern, just more keys.
  const SUBAREAS = ["HomeStage", "PoisonSwamp", "CrazyCapShop"];
  const SKYBOXES = [
    "CapWorldHomeStage",
    "WaterFallWorldHomeStage",
    "SandWorldHomeStage",
    "LakeWorldHomeStage",
    "ForestWorldHomeStage"
  ];

  const STATUS_OPTIONS = [
    "",
    "Good to Use",
    "Looks Bad - Don't Use",
    "Lags Kingdom",
    "Lag(emu)",
    "Good but Dark",
    "Good but Bright",
    "Good but Foggy",
    "Uncertain"
  ];

  function statusClass(value) {
    if (value === "Good to Use") return "status-good";
    if (value === "Looks Bad - Don't Use" || value === "Lags Kingdom" || value === "Lag(emu)") return "status-bad";
    if (value && value !== "") return "status-warn";
    return "status-neutral";
  }

  // ===================== SEEDING (one-time setup) =====================
  // Firestore has no concept of "create this collection ahead of time" -
  // collections/documents are just created the first time you write to
  // them. This button writes one blank document per subarea, purely so
  // there's something to see/edit on first load. You'd only click this
  // once - re-clicking it just overwrites with blanks again, harmless.
  document.getElementById('seedBtn').addEventListener('click', async () => {
    for (const subarea of SUBAREAS) {
      const blankStatuses = {};
      SKYBOXES.forEach(sb => { blankStatuses[sb] = ""; });

      // doc(db, collectionName, documentId) points at one specific document.
      // setDoc() creates it if it doesn't exist, or overwrites it if it does.
      await setDoc(doc(db, COLLECTION_NAME, subarea), { statuses: blankStatuses });
    }
    setStatusLine("Sample data seeded.", "connected");
  });

  // ===================== RENDERING THE TABLE =====================
  function buildTableHead() {
    const thead = document.getElementById('capTableHead');
    let html = '<tr><th>Subarea</th>';
    SKYBOXES.forEach(sb => { html += `<th>${sb}</th>`; });
    html += '</tr>';
    thead.innerHTML = html;
  }

  function renderRow(subarea, statuses) {
    let row = document.getElementById('row-' + subarea);
    if (!row) {
      row = document.createElement('tr');
      row.id = 'row-' + subarea;
      const nameTd = document.createElement('td');
      nameTd.textContent = subarea;
      nameTd.style.fontWeight = '600';
      row.appendChild(nameTd);
      document.getElementById('capTableBody').appendChild(row);
    }

    SKYBOXES.forEach(sb => {
      let cellId = 'cell-' + subarea + '-' + sb;
      let td = document.getElementById(cellId);
      if (!td) {
        td = document.createElement('td');
        td.id = cellId;
        row.appendChild(td);
      }

      const currentValue = (statuses && statuses[sb]) || "";

      // Rebuild just this one dropdown - simple and fine at this scale.
      const select = document.createElement('select');
      select.className = statusClass(currentValue);
      STATUS_OPTIONS.forEach(opt => {
        const option = document.createElement('option');
        option.value = opt;
        option.textContent = opt === "" ? "-- Select --" : opt;
        if (opt === currentValue) option.selected = true;
        select.appendChild(option);
      });

      // ===================== WRITING BACK TO FIRESTORE =====================
      // On change, write just this one field using dot-notation
      // ("statuses.SkyboxName") so we only touch the one value that
      // changed, instead of re-sending the whole document every time.
      select.addEventListener('change', async () => {
        const newValue = select.value;
        select.className = statusClass(newValue);

        try {
          await setDoc(
            doc(db, COLLECTION_NAME, subarea),
            { statuses: { [sb]: newValue } },
            { merge: true } // merge:true = update just this field, don't wipe the rest of the document
          );
          setStatusLine('Saved "' + sb + '" for ' + subarea + '.', "connected");
        } catch (err) {
          setStatusLine("Error saving: " + err.message, "error");
        }
      });

      td.innerHTML = '';
      td.appendChild(select);
    });
  }

  function setStatusLine(text, cls) {
    const el = document.getElementById('statusLine');
    el.textContent = text;
    el.className = cls || '';
  }

  // ===================== LIVE SYNC =====================
  // onSnapshot() is the big upgrade over how the Sheets version worked:
  // instead of only fetching data once when the page loads, this keeps a
  // live connection open and re-runs the callback automatically any time
  // ANYTHING changes in this collection - including changes made by
  // someone else, in a different browser tab, in real time. No refresh
  // button, no polling, no "did I get the latest version" uncertainty.
  buildTableHead();

  onSnapshot(
    collection(db, COLLECTION_NAME),
    (snapshot) => {
      if (snapshot.empty) {
        setStatusLine('No data yet - click "Seed Sample Data" above to create some test rows.', "");
        return;
      }
      snapshot.forEach(docSnap => {
        renderRow(docSnap.id, docSnap.data().statuses);
      });
      setStatusLine("Connected - live syncing.", "connected");
    },
    (err) => {
      setStatusLine("Connection error: " + err.message, "error");
    }
  );
</script>

</body>
</html>

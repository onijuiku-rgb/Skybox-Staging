<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firebase Test - All Kingdoms Prototype</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background-color: #121212;
    color: #e6e6e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }

  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  p.subtitle { color: #999; margin: 0 0 16px; font-size: 13px; }

  #statusLine {
    font-size: 12px;
    color: #888;
    margin-bottom: 16px;
    min-height: 16px;
  }

  #statusLine.connected { color: #17c964; }
  #statusLine.error { color: #f87171; }

  button {
    background-color: #2b2d31;
    color: #fff;
    border: 1px solid #3f4147;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }

  button:hover { border-color: #5865F2; }

  #seedBtn { margin-bottom: 20px; }

  /* ===================== KINGDOM TABS ===================== */
  .tab-bar {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 12px;
    border-bottom: 1px solid #2a2a2a;
  }

  .tab-btn {
    background-color: #1e1f22;
    color: #aaa;
    border: 1px solid #333;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .tab-btn:hover { border-color: #5865F2; }

  .tab-btn.active {
    background-color: #5865F2;
    color: #fff;
    border-color: #5865F2;
  }

  /* ===================== MAIN STATUS TABLE ===================== */
  .table-scroll-wrapper {
    overflow-x: auto;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    margin-bottom: 30px;
  }

  .table-scroll-wrapper::-webkit-scrollbar { height: 12px; }
  .table-scroll-wrapper::-webkit-scrollbar-track { background: #1a1a1a; }
  .table-scroll-wrapper::-webkit-scrollbar-thumb {
    background-color: #3d3d3d;
    border-radius: 6px;
    border: 3px solid #1a1a1a;
  }
  .table-scroll-wrapper { scrollbar-color: #3d3d3d #1a1a1a; scrollbar-width: thin; }

  table {
    border-collapse: collapse;
    width: max-content;
  }

  th, td {
    padding: 8px 10px;
    text-align: left;
    border-bottom: 1px solid #2a2a2a;
    font-size: 13px;
    white-space: nowrap;
  }

  th {
    color: #a3e6be;
    border-bottom: 2px solid #17382d;
    background-color: #121212;
  }

  /* Keeps the Subarea name visible while scrolling right through all
     136 skybox columns - same idea as a frozen column in a spreadsheet. */
  th:first-child, td:first-child {
    position: sticky;
    left: 0;
    background-color: #121212;
    z-index: 1;
  }

  select {
    background-color: #2b2d31;
    color: #fff;
    border: 1px solid #3f4147;
    border-radius: 12px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  select.status-good { background-color: #1c5c34; border-color: #1c5c34; }
  select.status-bad { background-color: #5c1c1c; border-color: #5c1c1c; }
  select.status-warn { background-color: #5c4a1c; border-color: #5c4a1c; }
  select.status-neutral { background-color: #2b2d31; }

  /* ===================== SUMMARY / ISSUES SECTION ===================== */
  .summary-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 14px;
  }

  .summary-header h2 {
    margin: 0;
    font-size: 1.1rem;
    color: #fbe38e;
  }

  .progress-badge {
    background-color: #1a1a1a;
    border: 1px solid #3d3d3d;
    color: #a3e6be;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }

  .progress-badge.complete { color: #17c964; border-color: #17c964; }

  .summary-controls {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .summary-search-input, .summary-select-filter {
    background-color: #1a1a1a;
    border: 1px solid #3d3d3d;
    color: #ffffff;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 12px;
    outline: none;
  }

  .summary-search-input:focus, .summary-select-filter:focus { border-color: #189844; }

  /* Filter checkboxes - toggled open/closed via the "Filters" button */
  #filterPanel {
    display: none;
    flex-wrap: wrap;
    gap: 14px;
    background-color: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 6px;
    padding: 12px 16px;
    margin-bottom: 14px;
    font-size: 12px;
  }

  #filterPanel.open { display: flex; }

  #filterPanel label {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #ccc;
    cursor: pointer;
  }

  .summary-table {
    width: 100%;
    border-collapse: collapse;
  }

  .summary-table th {
    text-align: left;
    font-size: 12px;
    color: #999;
    border-bottom: 1px solid #2a2a2a;
    padding: 8px 10px;
    background: none;
  }

  .summary-table td {
    padding: 8px 10px;
    border-bottom: 1px solid #222;
    font-size: 13px;
    white-space: normal;
  }

  .summary-table .status-text-bad { color: #f87171; font-weight: 600; }
  .summary-table .status-text-warn { color: #fbe38e; font-weight: 600; }
  .summary-table .status-text-neutral { color: #999; font-style: italic; }

  #emptySummary {
    color: #777;
    font-size: 13px;
    padding: 16px 0;
    display: none;
  }
</style>
</head>
<body>

<h1>Firebase Test - All Kingdoms Prototype</h1>
<p class="subtitle">Real spreadsheet data, all 17 Kingdoms, reading and writing live from Firestore.</p>

<div id="statusLine">Loading Kingdom list...</div>

<button id="seedBtn">Seed All Kingdoms (real data - only needed once)</button>

<div class="tab-bar" id="tabBar"></div>

<div class="table-scroll-wrapper">
  <table id="mainTable">
    <thead id="mainTableHead"></thead>
    <tbody id="mainTableBody"></tbody>
  </table>
</div>

<div class="summary-header">
  <h2>&#9888; Issues &amp; Actionable Skyboxes (<span id="activeKingdomName">-</span>)</h2>
  <div class="progress-badge" id="progressBadge"></div>
  <div class="summary-controls">
    <button id="toggleFiltersBtn">Filters</button>
    <select class="summary-select-filter" id="subareaFilterSelect">
      <option value="">All Subareas</option>
    </select>
    <input type="text" class="summary-search-input" id="searchInput" placeholder="Search subarea or skybox...">
  </div>
</div>

<div id="filterPanel"></div>

<table class="summary-table">
  <thead>
    <tr><th>Loading Zone (Subarea)</th><th>Skybox</th><th>Status / Action</th></tr>
  </thead>
  <tbody id="summaryTableBody"></tbody>
</table>
<div id="emptySummary">Nothing matches the current filters.</div>

<script type="module">
  // ===================== FIREBASE SETUP =====================
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore,
    collection,
    doc,
    setDoc,
    onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAzJhU7wI1iFPEExIgCD-DpZ8sKljtH7Yk",
    authDomain: "smo-skybox-testing.firebaseapp.com",
    projectId: "smo-skybox-testing",
    storageBucket: "smo-skybox-testing.firebasestorage.app",
    messagingSenderId: "604114241784",
    appId: "1:604114241784:web:591528df76f683a843530d"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ===================== STATUS OPTIONS =====================
  // Same set/meanings as the Apps Script version's dropdown pills.
  const STATUS_OPTIONS = [
    "",
    "Good to Use",
    "Looks Bad - Don't Use",
    "Lags Kingdom",
    "Lag(emu)",
    "Good but Dark",
    "Good but Bright",
    "Good but Foggy",
    "Uncertain"
  ];

  function statusClass(value) {
    if (value === "Good to Use") return "status-good";
    if (value === "Looks Bad - Don't Use" || value === "Lags Kingdom" || value === "Lag(emu)") return "status-bad";
    if (value && value !== "") return "status-warn";
    return "status-neutral";
  }

  function statusTextClass(value) {
    if (value === "Looks Bad - Don't Use" || value === "Lags Kingdom" || value === "Lag(emu)") return "status-text-bad";
    if (value && value !== "" && value !== "Good to Use") return "status-text-warn";
    return "status-text-neutral";
  }

  // ===================== GLOBAL STATE =====================
  let KINGDOMS = [];   // [{ slug, label, subareas: [...] }, ...] - loaded from kingdoms-config.json
  let SKYBOXES = [];   // shared 136-name list, same order for every Kingdom
  let activeSlug = null;
  let activeLabel = '';
  let activeSubareas = [];
  let currentData = {};        // { subareaName: { skyboxName: status } } for the CURRENTLY ACTIVE kingdom only
  let unsubscribeSnapshot = null; // stops the previous Kingdom's live listener when switching tabs

  // Filters (shared across all Kingdoms, not reset when switching tabs)
  let hiddenStatuses = new Set(["Good to Use"]); // "Good to Use" hidden by default - the summary table is meant to highlight problems, not everything
  let subareaFilter = "";
  let searchQuery = "";

  // ===================== LOAD CONFIG, THEN BUILD TABS =====================
  async function init() {
    const res = await fetch('kingdoms-config.json');
    const config = await res.json();
    KINGDOMS = config.kingdoms;
    SKYBOXES = config.skyboxes;

    buildFilterPanel();
    buildTabs();
    switchKingdom(KINGDOMS[0].slug); // open on the first Kingdom by default
  }

  function buildTabs() {
    const tabBar = document.getElementById('tabBar');
    tabBar.innerHTML = '';
    KINGDOMS.forEach(k => {
      const btn = document.createElement('button');
      btn.className = 'tab-btn';
      btn.textContent = k.label;
      btn.dataset.slug = k.slug;
      btn.addEventListener('click', () => switchKingdom(k.slug));
      tabBar.appendChild(btn);
    });
  }

  function setActiveTabStyling() {
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.slug === activeSlug);
    });
  }

  // ===================== SWITCHING KINGDOMS =====================
  function switchKingdom(slug) {
    const kingdom = KINGDOMS.find(k => k.slug === slug);
    if (!kingdom) return;

    activeSlug = slug;
    activeLabel = kingdom.label;
    activeSubareas = kingdom.subareas;
    currentData = {};

    document.getElementById('activeKingdomName').textContent = activeLabel;
    setActiveTabStyling();
    buildSubareaFilterOptions();
    buildMainTableSkeleton();

    // Stop listening to the PREVIOUS Kingdom's collection before starting
    // a new one - otherwise every past tab you've visited keeps updating
    // in the background forever, which is wasted reads and a memory leak.
    if (unsubscribeSnapshot) unsubscribeSnapshot();

    unsubscribeSnapshot = onSnapshot(
      collection(db, slug),
      (snapshot) => {
        if (snapshot.empty) {
          setStatusLine(`No data yet for ${activeLabel} - click "Seed All Kingdoms" above.`, "");
        } else {
          snapshot.forEach(docSnap => {
            currentData[docSnap.id] = docSnap.data().statuses || {};
          });
          setStatusLine("Connected - live syncing.", "connected");
        }
        renderMainTable();
        renderProgressCounter();
        renderSummaryTable();
      },
      (err) => setStatusLine("Connection error: " + err.message, "error")
    );
  }

  function setStatusLine(text, cls) {
    const el = document.getElementById('statusLine');
    el.textContent = text;
    el.className = cls || '';
  }

  // ===================== MAIN STATUS TABLE =====================
  function buildMainTableSkeleton() {
    const thead = document.getElementById('mainTableHead');
    let headHtml = '<tr><th>Subarea</th>';
    SKYBOXES.forEach(sb => { headHtml += `<th>${sb}</th>`; });
    headHtml += '</tr>';
    thead.innerHTML = headHtml;

    const tbody = document.getElementById('mainTableBody');
    tbody.innerHTML = '';
    activeSubareas.forEach(subarea => {
      const row = document.createElement('tr');
      row.id = 'row-' + subarea;
      const nameTd = document.createElement('td');
      nameTd.textContent = subarea;
      nameTd.style.fontWeight = '600';
      row.appendChild(nameTd);
      tbody.appendChild(row);
    });
  }

  function renderMainTable() {
    activeSubareas.forEach(subarea => {
      const row = document.getElementById('row-' + subarea);
      if (!row) return;
      const statuses = currentData[subarea] || {};

      SKYBOXES.forEach(sb => {
        let cellId = 'cell-' + subarea + '-' + sb;
        let td = document.getElementById(cellId);
        if (!td) {
          td = document.createElement('td');
          td.id = cellId;
          row.appendChild(td);
        }

        const currentValue = statuses[sb] || "";
        const select = document.createElement('select');
        select.className = statusClass(currentValue);
        STATUS_OPTIONS.forEach(opt => {
          const option = document.createElement('option');
          option.value = opt;
          option.textContent = opt === "" ? "-- Select --" : opt;
          if (opt === currentValue) option.selected = true;
          select.appendChild(option);
        });

        select.addEventListener('change', async () => {
          const newValue = select.value;
          select.className = statusClass(newValue);
          try {
            await setDoc(doc(db, activeSlug, subarea), { statuses: { [sb]: newValue } }, { merge: true });
            setStatusLine(`Saved "${sb}" for ${subarea}.`, "connected");
          } catch (err) {
            setStatusLine("Error saving: " + err.message, "error");
          }
        });

        td.innerHTML = '';
        td.appendChild(select);
      });
    });
  }

  // ===================== PROGRESS COUNTER =====================
  // Same formula as the Apps Script version: total = every status cell
  // across every subarea (subareas x 136 skyboxes), filled = how many
  // aren't blank.
  function renderProgressCounter() {
    const badge = document.getElementById('progressBadge');
    const totalCells = activeSubareas.length * SKYBOXES.length;
    let filled = 0;

    activeSubareas.forEach(subarea => {
      const statuses = currentData[subarea] || {};
      SKYBOXES.forEach(sb => {
        if ((statuses[sb] || "").trim() !== "") filled++;
      });
    });

    const pct = totalCells > 0 ? (filled / totalCells) * 100 : 0;
    badge.textContent = `${filled} / ${totalCells} marked (${pct.toFixed(2)}%)`;
    badge.classList.toggle('complete', totalCells > 0 && filled === totalCells);
  }

  // ===================== SUMMARY / ISSUES TABLE =====================
  function buildSubareaFilterOptions() {
    const select = document.getElementById('subareaFilterSelect');
    select.innerHTML = '<option value="">All Subareas</option>';
    activeSubareas.forEach(subarea => {
      const opt = document.createElement('option');
      opt.value = subarea;
      opt.textContent = subarea;
      select.appendChild(opt);
    });
    select.value = subareaFilter; // keep whatever was selected, if it still applies
  }

  function buildFilterPanel() {
    const panel = document.getElementById('filterPanel');
    panel.innerHTML = '';
    STATUS_OPTIONS.filter(s => s !== "").forEach(status => {
      const label = document.createElement('label');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = !hiddenStatuses.has(status);
      checkbox.addEventListener('change', () => {
        if (checkbox.checked) hiddenStatuses.delete(status);
        else hiddenStatuses.add(status);
        renderSummaryTable();
      });
      label.appendChild(checkbox);
      label.appendChild(document.createTextNode('Show "' + status + '"'));
      panel.appendChild(label);
    });
  }

  document.getElementById('toggleFiltersBtn').addEventListener('click', () => {
    document.getElementById('filterPanel').classList.toggle('open');
  });

  document.getElementById('subareaFilterSelect').addEventListener('change', (e) => {
    subareaFilter = e.target.value;
    renderSummaryTable();
  });

  document.getElementById('searchInput').addEventListener('input', (e) => {
    searchQuery = e.target.value.trim().toLowerCase();
    renderSummaryTable();
  });

  // Lists every (subarea, skybox) pair that: has a status set, isn't
  // hidden by the filter checkboxes, matches the subarea dropdown (if
  // one's selected), and matches the search box (if anything's typed).
  function renderSummaryTable() {
    const tbody = document.getElementById('summaryTableBody');
    const emptyMsg = document.getElementById('emptySummary');
    tbody.innerHTML = '';

    let rowCount = 0;

    activeSubareas.forEach(subarea => {
      if (subareaFilter && subarea !== subareaFilter) return;
      const statuses = currentData[subarea] || {};

      SKYBOXES.forEach(sb => {
        const value = statuses[sb] || "";
        if (value === "") return;           // unset cells never show in the issues list
        if (hiddenStatuses.has(value)) return;

        if (searchQuery) {
          const haystack = (subarea + ' ' + sb).toLowerCase();
          if (!haystack.includes(searchQuery)) return;
        }

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${subarea}</td>
          <td>${sb}</td>
          <td class="${statusTextClass(value)}">${value}</td>
        `;
        tbody.appendChild(tr);
        rowCount++;
      });
    });

    emptyMsg.style.display = rowCount === 0 ? 'block' : 'none';
  }

  // ===================== SEED ALL KINGDOMS =====================
  document.getElementById('seedBtn').addEventListener('click', async () => {
    setStatusLine("Fetching real spreadsheet data...", "");
    const res = await fetch('seed-data.json');
    const seedData = await res.json(); // { slug: { subarea: { skybox: status } } }

    let written = 0;
    for (const kingdom of KINGDOMS) {
      const kingdomData = seedData[kingdom.slug];
      for (const subarea of kingdom.subareas) {
        await setDoc(doc(db, kingdom.slug, subarea), { statuses: kingdomData[subarea] });
        written++;
        setStatusLine(`Seeding... ${written} subareas written so far.`, "");
      }
    }
    setStatusLine(`Done - seeded ${written} subareas across ${KINGDOMS.length} Kingdoms.`, "connected");
  });

  init();
</script>

</body>
</html>

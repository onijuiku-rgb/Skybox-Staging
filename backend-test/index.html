<title>Firebase Test - CapKingdom Prototype</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background-color: #121212;
    color: #e6e6e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }

  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  p.subtitle { color: #999; margin: 0 0 20px; font-size: 13px; }

  #statusLine {
    font-size: 12px;
    color: #888;
    margin-bottom: 16px;
    min-height: 16px;
  }

  #statusLine.connected { color: #17c964; }
  #statusLine.error { color: #f87171; }

  button {
    background-color: #2b2d31;
    color: #fff;
    border: 1px solid #3f4147;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 20px;
  }

  button:hover { border-color: #5865F2; }

  /* 136 columns needs horizontal scrolling - this wrapper is what scrolls,
     not the page itself, so the "Subarea" column can stay visible via
     position: sticky (see th:first-child / td:first-child below). */
  .table-scroll-wrapper {
    overflow-x: auto;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
  }

  .table-scroll-wrapper::-webkit-scrollbar { height: 12px; }
  .table-scroll-wrapper::-webkit-scrollbar-track { background: #1a1a1a; }
  .table-scroll-wrapper::-webkit-scrollbar-thumb {
    background-color: #3d3d3d;
    border-radius: 6px;
    border: 3px solid #1a1a1a;
  }
  .table-scroll-wrapper { scrollbar-color: #3d3d3d #1a1a1a; scrollbar-width: thin; }

  table {
    border-collapse: collapse;
    width: max-content; /* let the table grow as wide as it needs to fit every column */
  }

  th, td {
    padding: 8px 10px;
    text-align: left;
    border-bottom: 1px solid #2a2a2a;
    font-size: 13px;
    white-space: nowrap;
  }

  th {
    color: #a3e6be;
    border-bottom: 2px solid #17382d;
    background-color: #121212;
  }

  /* Keeps the Subarea name visible while scrolling right through all
     136 skybox columns - same idea as a frozen column in a spreadsheet. */
  th:first-child, td:first-child {
    position: sticky;
    left: 0;
    background-color: #121212;
    z-index: 1;
  }

  select {
    background-color: #2b2d31;
    color: #fff;
    border: 1px solid #3f4147;
    border-radius: 12px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  /* Status colors - same meanings as the Apps Script version's dropdown pills */
  select.status-good { background-color: #1c5c34; border-color: #1c5c34; }
  select.status-bad { background-color: #5c1c1c; border-color: #5c1c1c; }
  select.status-warn { background-color: #5c4a1c; border-color: #5c4a1c; }
  select.status-neutral { background-color: #2b2d31; }
</style>
</head>

      "SnowWorldTownStage": "Good to Use",
      "SnowWorldLobby000Stage": "Good to Use",
      "Special2WorldCloudStage": "Good but dark at end",
      "Special2WorldKoopaStage": "Looks Bad - Don't Use"
    }
  }
};

  // A NEW collection name (not the old 5-skybox "capKingdom_test" one
  // from before) since this is now real, full-scale data. The old test
  // collection is still sitting in Firestore, harmless, safe to ignore
  // or delete later from the Firebase console.
  const COLLECTION_NAME = "capKingdom";

  const SUBAREAS = REAL_DATA.subareas;
  const SKYBOXES = REAL_DATA.skyboxes;

  const STATUS_OPTIONS = [
    "",
    "Good to Use",
    "Looks Bad - Don't Use",
    "Lags Kingdom",
    "Lag(emu)",
    "Good but Dark",
    "Good but Bright",
    "Good but Foggy",
    "Uncertain"
  ];

  function statusClass(value) {
    if (value === "Good to Use") return "status-good";
    if (value === "Looks Bad - Don't Use" || value === "Lags Kingdom" || value === "Lag(emu)") return "status-bad";
    if (value && value !== "") return "status-warn";
    return "status-neutral";
  }

  // ===================== SEEDING (one-time setup) =====================
  document.getElementById('seedBtn').addEventListener('click', async () => {
    setStatusLine("Seeding real data - this writes 6 documents, one per subarea...", "");
    for (const subarea of SUBAREAS) {
      await setDoc(doc(db, COLLECTION_NAME, subarea), { statuses: REAL_DATA.data[subarea] });
    }
    setStatusLine("Real CapKingdom data seeded.", "connected");
  });

  // ===================== RENDERING THE TABLE =====================
  function buildTableHead() {
    const thead = document.getElementById('capTableHead');
    let html = '<tr><th>Subarea</th>';
    SKYBOXES.forEach(sb => { html += `<th>${sb}</th>`; });
    html += '</tr>';
    thead.innerHTML = html;
  }

  function buildTableRows() {
    const tbody = document.getElementById('capTableBody');
    tbody.innerHTML = '';
    SUBAREAS.forEach(subarea => {
      const row = document.createElement('tr');
      row.id = 'row-' + subarea;
      const nameTd = document.createElement('td');
      nameTd.textContent = subarea;
      nameTd.style.fontWeight = '600';
      row.appendChild(nameTd);
      tbody.appendChild(row);
    });
  }

  function renderRow(subarea, statuses) {
    const row = document.getElementById('row-' + subarea);
    if (!row) return;

    SKYBOXES.forEach(sb => {
      let cellId = 'cell-' + subarea + '-' + sb;
      let td = document.getElementById(cellId);
      if (!td) {
        td = document.createElement('td');
        td.id = cellId;
        row.appendChild(td);
      }

      const currentValue = (statuses && statuses[sb]) || "";

      const select = document.createElement('select');
      select.className = statusClass(currentValue);
      STATUS_OPTIONS.forEach(opt => {
        const option = document.createElement('option');
        option.value = opt;
        option.textContent = opt === "" ? "-- Select --" : opt;
        if (opt === currentValue) option.selected = true;
        select.appendChild(option);
      });

      select.addEventListener('change', async () => {
        const newValue = select.value;
        select.className = statusClass(newValue);

        try {
          await setDoc(
            doc(db, COLLECTION_NAME, subarea),
            { statuses: { [sb]: newValue } },
            { merge: true }
          );
          setStatusLine('Saved "' + sb + '" for ' + subarea + '.', "connected");
        } catch (err) {
          setStatusLine("Error saving: " + err.message, "error");
        }
      });

      td.innerHTML = '';
      td.appendChild(select);
    });
  }

  function setStatusLine(text, cls) {
    const el = document.getElementById('statusLine');
    el.textContent = text;
    el.className = cls || '';
  }

  // ===================== LIVE SYNC =====================
  buildTableHead();
  buildTableRows();

  onSnapshot(
    collection(db, COLLECTION_NAME),
    (snapshot) => {
      if (snapshot.empty) {
        setStatusLine('No data yet - click "Seed Real CapKingdom Data" above.', "");
        return;
      }
      snapshot.forEach(docSnap => {
        renderRow(docSnap.id, docSnap.data().statuses);
      });
      setStatusLine("Connected - live syncing.", "connected");
    },
    (err) => {
      setStatusLine("Connection error: " + err.message, "error");
    }
  );
</script>

</body>
</html>
